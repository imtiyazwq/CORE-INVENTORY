services:
  - type: web
    name: core-inventory
    runtime: python
    buildCommand: npm install && npm run build && pip install -r database/requirements.txt
    startCommand: gunicorn database.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: INVENTORY_API_KEY
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DATABASE_URL
        fromDatabase:
          name: core-inventory-db
          property: connectionString

  - type: pserv
    name: core-inventory-db
    runtime: postgres
    plan: free
