services:
  - type: web
    name: core-inventory
    runtime: python
    buildCommand: npm install && npm run build && pip install -r database/requirements.txt
    startCommand: gunicorn database.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: INVENTORY_API_KEY
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      # Points at an external Postgres (e.g. a free Neon or Supabase project)
      # instead of a Render-managed database, since Render requires a card on
      # file to provision its own Postgres even on the free plan. Paste the
      # connection string in the Render dashboard after the first deploy, or
      # here before deploying - see RENDER-DEPLOYMENT.md.
      - key: DATABASE_URL
        sync: false
