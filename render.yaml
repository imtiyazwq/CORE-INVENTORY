services:
  - type: web
    name: core-inventory
    runtime: python
    buildCommand: npm install && npm run build && pip install -r database/requirements.txt
    startCommand: gunicorn database.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: core-inventory-db
          property: connectionString

  - type: pserv
    name: core-inventory-db
    runtime: postgres
    plan: free
