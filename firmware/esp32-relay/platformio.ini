[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Kept from when this build also included BLE (laptop link has since moved
; to USB serial - see usb_bridge.h - so flash usage dropped well under the
; default ~1.3MB app partition). Left as-is since this node never does OTA
; anyway, so the extra space isn't costing anything; switching back to the
; default partition table would need a full chip erase, not just a reflash.
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
build_flags =
    -DCORE_DEBUG_LEVEL=1
